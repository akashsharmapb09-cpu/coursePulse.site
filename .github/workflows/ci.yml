name: CoursePulse CI
on:
  pull_request:
  push:
    branches: [main, feat/master-prompt-completion]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://coursepulse:placeholder@localhost:5432/coursepulse
          DIRECT_URL: postgresql://coursepulse:placeholder@localhost:5432/coursepulse
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_APP_URL: https://coursepulse.example
      # Install a pinned browser-test runner without changing the application's dependency manifest or lockfile.
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1 axe-core@4.14.0
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      # Read-only smoke checks against the current .site feature-branch preview alias; no login or database writes.
      - name: Public browser smoke tests
        run: npx playwright test --config=playwright.config.mjs
        env:
          COURSEPULSE_BASE_URL: https://coursepulse-site-git-feat-master-pr-49ad8a-akashsharmapb09-8177.vercel.app
