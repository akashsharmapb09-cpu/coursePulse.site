name: CoursePulse CI
on:
  pull_request:
  push:
    branches: [main, feat/master-prompt-completion]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://coursepulse:placeholder@localhost:5432/coursepulse
          DIRECT_URL: postgresql://coursepulse:placeholder@localhost:5432/coursepulse
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_APP_URL: https://coursepulse.example
      # Install a pinned browser-test runner without changing the application's dependency manifest or lockfile.
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1 axe-core@4.14.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Read-only smoke checks against the public .site production URL; no login or database writes.
      - name: Public browser smoke tests
        run: npx playwright test --config=playwright.config.mjs
        env:
          COURSEPULSE_BASE_URL: https://coursepulse-site.vercel.app
