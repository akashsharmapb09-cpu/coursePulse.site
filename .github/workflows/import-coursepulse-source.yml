name: Import staged CoursePulse source

on:
  push:
    branches:
      - 'coursepulse/master-prompt-implementation'
    paths:
      - '.coursepulse-source.part*.b64'
      - '.github/workflows/import-coursepulse-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Restore source files
        shell: bash
        run: |
          set -euo pipefail
          cat .coursepulse-source.part*.b64 | base64 --decode | tar -xz --no-same-owner
          rm .coursepulse-source.part*.b64

      - name: Commit source implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import completed CoursePulse implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
